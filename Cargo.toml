[package]
name = "ls2"
version = "0.1.2"
edition = "2024"
rust-version = "1.85"
description = "Async Luna Service 2 IPC for webOS TV"
license = "MIT"
readme = "README.md"
repository = "https://github.com/sundermann/ls2"
documentation = "https://docs.rs/ls2"
keywords = ["webos", "luna", "ls2", "ipc"]
categories = ["asynchronous", "network-programming"]

[package.metadata.docs.rs]
all-features = true

[features]
default = []
serde = ["dep:serde", "dep:serde_json"]

[dependencies]
async-channel = "2"
async-global-executor = "3"
async-io = "2"
futures-core = "0.3"
futures-lite = "2"
json = "0.12"
object = { version = "0.36.7", default-features = false, features = ["read_core", "elf", "std", "unaligned"] }
rustix = { version = "1", features = ["net", "fs"] }
serde = { version = "1", optional = true }
serde_json = { version = "1", optional = true }

[dev-dependencies]
smol = "2"
tokio = { version = "1", features = ["macros", "rt", "time"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.rustdoc]
broken_intra_doc_links = "deny"
